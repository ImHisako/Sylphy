name: Sylphy CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: sylphy-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  FLUTTER_VERSION: 3.35.5
  RUST_VERSION: 1.89.0

jobs:
  quality:
    name: Analyze and test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: ${{ env.RUST_VERSION }}
          components: rustfmt

      - name: Install Protobuf compiler
        run: sudo apt-get update && sudo apt-get install -y protobuf-compiler

      - name: Resolve Flutter packages
        run: flutter pub get

      - name: Verify formatting
        run: dart format --output=none --set-exit-if-changed lib test

      - name: Analyze Flutter client
        run: flutter analyze

      - name: Test Flutter client
        run: flutter test

      - name: Verify Rust formatting
        run: cargo fmt --manifest-path native/core/Cargo.toml -- --check

      - name: Test native security core
        run: cargo test --locked --manifest-path native/core/Cargo.toml --features signal-ratchet

  linux:
    name: Build Linux native bundle
    needs: quality
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install desktop dependencies
        run: sudo apt-get update && sudo apt-get install -y clang cmake ninja-build pkg-config libgtk-3-dev liblzma-dev protobuf-compiler

      - name: Install Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: ${{ env.RUST_VERSION }}

      - name: Build native core
        run: bash native/build-linux.sh release

      - name: Build Linux application
        run: flutter build linux --release

      - name: Verify native library is bundled
        run: test -f build/linux/x64/release/bundle/lib/libsylphy_core.so

      - name: Upload Linux bundle
        uses: actions/upload-artifact@v4
        with:
          name: sylphy-linux
          path: build/linux/x64/release/bundle
          if-no-files-found: error

  windows:
    name: Build Windows native bundle
    needs: quality
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: ${{ env.RUST_VERSION }}

      - name: Install Protobuf compiler
        run: choco install protoc --no-progress -y

      - name: Build native core
        shell: pwsh
        run: ./native/build-windows.ps1 -Profile release

      - name: Build Windows application
        run: flutter build windows --release

      - name: Verify native library is bundled
        shell: pwsh
        run: if (-not (Test-Path build/windows/x64/runner/Release/sylphy_core.dll)) { throw 'sylphy_core.dll non inclusa' }

      - name: Upload Windows bundle
        uses: actions/upload-artifact@v4
        with:
          name: sylphy-windows
          path: build/windows/x64/runner/Release
          if-no-files-found: error
