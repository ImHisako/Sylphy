name: Sylphy CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: sylphy-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  FLUTTER_VERSION: 3.35.5
  RUST_VERSION: 1.93.1

jobs:
  quality:
    name: Analyze and test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Validate release version and increasing build number
        if: startsWith(github.ref, 'refs/tags/v')
        run: python3 tool/release.py validate --tag "$GITHUB_REF_NAME"

      - name: Test release packaging
        run: python3 -m unittest discover -s tool -p 'test_*.py'

      - name: Install Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: ${{ env.RUST_VERSION }}
          components: rustfmt

      - name: Install Protobuf compiler
        run: sudo apt-get update && sudo apt-get install -y protobuf-compiler

      - name: Resolve Flutter packages
        run: flutter pub get

      - name: Verify formatting
        run: dart format --output=none --set-exit-if-changed lib test

      - name: Analyze Flutter client
        run: flutter analyze

      - name: Test Flutter client
        run: flutter test

      - name: Verify Rust formatting
        run: cargo fmt --manifest-path native/core/Cargo.toml -- --check

      - name: Test native security core
        run: cargo test --locked --manifest-path native/core/Cargo.toml --features veilid,signal-ratchet

      - name: Check native Veilid integration
        run: cargo check --locked --manifest-path native/core/Cargo.toml --features veilid,signal-ratchet

  linux:
    name: Build Linux native bundle
    needs: quality
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install desktop dependencies
        run: sudo apt-get update && sudo apt-get install -y clang cmake ninja-build pkg-config libgtk-3-dev liblzma-dev libsecret-1-dev libjsoncpp-dev protobuf-compiler

      - name: Install Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: ${{ env.RUST_VERSION }}

      - name: Build native core
        run: bash native/build-linux.sh release

      - name: Build Linux application
        run: flutter build linux --release

      - name: Verify native library is bundled
        run: test -f build/linux/x64/release/bundle/lib/libsylphy_core.so

      - name: Upload Linux bundle
        uses: actions/upload-artifact@v4
        with:
          name: sylphy-linux
          path: build/linux/x64/release/bundle
          if-no-files-found: error

  windows:
    name: Build Windows native bundle
    needs: quality
    # Flutter 3.35.x supports the Visual Studio 2022 CMake generator. Pin the
    # image because windows-latest now uses Visual Studio 2026.
    runs-on: windows-2022
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Verify Windows build toolchain
        shell: pwsh
        run: |
          flutter config --enable-windows-desktop
          flutter doctor -v
          $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
          $visualStudio = & $vswhere -latest -products * -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath
          $visualStudioVersion = & $vswhere -latest -products * -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationVersion
          if (-not $visualStudio -or $visualStudioVersion -notlike '17.*') {
            throw "Flutter $env:FLUTTER_VERSION richiede Visual Studio 2022 (17.x); rilevato: $visualStudioVersion"
          }
          Write-Host "Toolchain Visual Studio ${visualStudioVersion}: $visualStudio"

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: ${{ env.RUST_VERSION }}

      - name: Install Protobuf compiler
        uses: arduino/setup-protoc@v3
        with:
          version: "25.3"
          repo-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Verify Protobuf compiler
        shell: pwsh
        run: |
          $protoc = (Get-Command protoc -ErrorAction Stop).Source
          "PROTOC=$protoc" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          & $protoc --version

      - name: Build native core
        shell: pwsh
        run: ./native/build-windows.ps1 -Profile release

      - name: Build Windows application
        run: flutter build windows --release

      - name: Verify native library is bundled
        shell: pwsh
        run: if (-not (Test-Path build/windows/x64/runner/Release/sylphy_core.dll)) { throw 'sylphy_core.dll non inclusa' }

      - name: Build Windows update installer
        shell: pwsh
        run: |
          $versionLine = (Select-String -Path pubspec.yaml -Pattern '^version: (\d+\.\d+\.\d+)\+(\d+)$').Matches
          $appVersion = $versionLine.Groups[1].Value
          $buildNumber = $versionLine.Groups[2].Value
          $compiler = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path -LiteralPath $compiler)) { throw 'Inno Setup 6 missing on build runner.' }
          & $compiler "/DAppVersion=$appVersion" "/DBuildNumber=$buildNumber" tool/windows-installer.iss
          if ($LASTEXITCODE -ne 0) { throw 'Windows installer compilation failed.' }

      - name: Upload Windows installer
        uses: actions/upload-artifact@v4
        with:
          name: sylphy-windows-installer
          path: release-assets/*-setup.exe
          if-no-files-found: error

      - name: Upload Windows bundle
        uses: actions/upload-artifact@v4
        with:
          name: sylphy-windows
          path: build/windows/x64/runner/Release
          if-no-files-found: error

  android:
    name: Build Android APK
    needs: quality
    runs-on: ubuntu-latest
    env:
      SYLPHY_ALLOW_DEBUG_SIGNING: ${{ startsWith(github.ref, 'refs/tags/v') && 'false' || 'true' }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: ${{ env.RUST_VERSION }}
          targets: armv7-linux-androideabi,aarch64-linux-android,x86_64-linux-android

      - name: Install cargo-ndk and Protobuf compiler
        run: |
          cargo install cargo-ndk --locked
          sudo apt-get update
          sudo apt-get install -y protobuf-compiler

      - name: Install Veilid Android NDK
        run: |
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "ndk;28.2.13676358"
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/28.2.13676358" >> "$GITHUB_ENV"
          echo "ANDROID_NDK_ROOT=$ANDROID_HOME/ndk/28.2.13676358" >> "$GITHUB_ENV"

      - name: Build native core
        shell: pwsh
        run: ./native/build-android.ps1 -Profile release

      - name: Verify native libraries are bundled
        run: |
          test -f android/app/src/main/jniLibs/armeabi-v7a/libsylphy_core.so
          test -f android/app/src/main/jniLibs/arm64-v8a/libsylphy_core.so
          test -f android/app/src/main/jniLibs/x86_64/libsylphy_core.so

      - name: Configure persistent Android release signing
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.ANDROID_STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        shell: python
        run: |
          import base64, os, pathlib
          required = ['KEYSTORE_BASE64', 'STORE_PASSWORD', 'KEY_ALIAS', 'KEY_PASSWORD']
          if any(not os.environ.get(name) for name in required):
              raise SystemExit('Configure the four Android release signing secrets using the existing release key.')
          key = pathlib.Path(os.environ['RUNNER_TEMP']) / 'sylphy-release.jks'
          key.write_bytes(base64.b64decode(os.environ['KEYSTORE_BASE64'], validate=True))
          key.chmod(0o600)
          def prop(value):
              return ''.join('\\u%04x' % int.from_bytes(value.encode('utf-16-be')[i:i+2], 'big')
                             for i in range(0, len(value.encode('utf-16-be')), 2))
          values = {'storeFile': str(key), 'storePassword': os.environ['STORE_PASSWORD'],
                    'keyAlias': os.environ['KEY_ALIAS'], 'keyPassword': os.environ['KEY_PASSWORD']}
          pathlib.Path('android/key.properties').write_text(
              ''.join(name + '=' + prop(value) + '\n' for name, value in values.items()), encoding='ascii')

      - name: Build Android application
        run: flutter build apk --release

      - name: Verify APK can update the previous public release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 tool/verify_android_release.py

      - name: Upload Android APK
        uses: actions/upload-artifact@v4
        with:
          name: sylphy-android
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error

  release:
    name: Publish GitHub Release
    if: github.event_name == 'push' && github.ref_type == 'tag' && startsWith(github.ref_name, 'v')
    needs:
      - linux
      - windows
      - android
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Verify release version
        shell: bash
        run: |
          app_version="$(sed -n 's/^version: \([^+]*\).*/\1/p' pubspec.yaml)"
          tag_version="${GITHUB_REF_NAME#v}"
          if [[ -z "$app_version" || "$tag_version" != "$app_version" ]]; then
            echo "Il tag $GITHUB_REF_NAME non corrisponde alla versione $app_version in pubspec.yaml." >&2
            exit 1
          fi

      - name: Download Linux bundle
        uses: actions/download-artifact@v4
        with:
          name: sylphy-linux
          path: release/linux

      - name: Download Windows bundle
        uses: actions/download-artifact@v4
        with:
          name: sylphy-windows
          path: release/windows

      - name: Download Android APK
        uses: actions/download-artifact@v4
        with:
          name: sylphy-android
          path: release/android

      - name: Download Windows installer
        uses: actions/download-artifact@v4
        with:
          name: sylphy-windows-installer
          path: release-assets

      - name: Package release files
        shell: bash
        run: |
          mkdir -p release-assets
          chmod +x release/linux/sylphy
          tar -C release/linux -czf "release-assets/sylphy-${GITHUB_REF_NAME}-linux-x64.tar.gz" .
          (cd release/windows && zip -r "../../release-assets/sylphy-${GITHUB_REF_NAME}-windows-x64.zip" .)
          cp release/android/app-release.apk "release-assets/sylphy-${GITHUB_REF_NAME}-android.apk"
          python3 tool/release.py linux --bundle release/linux --output "release-assets/sylphy-${GITHUB_REF_NAME}-linux-x64.run"
          python3 tool/release.py metadata --output release-assets/sylphy-update.json
          (cd release-assets && sha256sum sylphy-* > SHA256SUMS.txt)

      - name: Create or update GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          # Publish only after every asset exists. Never replace public binaries
          # underneath clients that have already read their SHA-256 digests.
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            test "$(gh release view "$GITHUB_REF_NAME" --json isDraft --jq .isDraft)" = true || {
              echo 'Release already public. Create a new version/tag instead of replacing its files.' >&2
              exit 1
            }
          else
            gh release create "$GITHUB_REF_NAME" --draft --verify-tag --generate-notes --title "Sylphy $GITHUB_REF_NAME"
          fi
          gh release upload "$GITHUB_REF_NAME" release-assets/* --clobber
          gh release edit "$GITHUB_REF_NAME" --draft=false --latest
