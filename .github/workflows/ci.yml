name: Sylphy CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: sylphy-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  FLUTTER_VERSION: 3.35.5
  RUST_VERSION: 1.89.0

jobs:
  quality:
    name: Analyze and test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: ${{ env.RUST_VERSION }}
          components: rustfmt

      - name: Install Protobuf compiler
        run: sudo apt-get update && sudo apt-get install -y protobuf-compiler

      - name: Resolve Flutter packages
        run: flutter pub get

      - name: Verify formatting
        run: dart format --output=none --set-exit-if-changed lib test

      - name: Analyze Flutter client
        run: flutter analyze

      - name: Test Flutter client
        run: flutter test

      - name: Verify Rust formatting
        run: cargo fmt --manifest-path native/core/Cargo.toml -- --check

      - name: Test native security core
        run: cargo test --locked --manifest-path native/core/Cargo.toml --features signal-ratchet

      - name: Check native Veilid integration
        run: cargo check --locked --manifest-path native/core/Cargo.toml --features veilid,signal-ratchet

  linux:
    name: Build Linux native bundle
    needs: quality
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install desktop dependencies
        run: sudo apt-get update && sudo apt-get install -y clang cmake ninja-build pkg-config libgtk-3-dev liblzma-dev libsecret-1-dev libjsoncpp-dev protobuf-compiler

      - name: Install Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: ${{ env.RUST_VERSION }}

      - name: Build native core
        run: bash native/build-linux.sh release

      - name: Build Linux application
        run: flutter build linux --release

      - name: Verify native library is bundled
        run: test -f build/linux/x64/release/bundle/lib/libsylphy_core.so

      - name: Upload Linux bundle
        uses: actions/upload-artifact@v4
        with:
          name: sylphy-linux
          path: build/linux/x64/release/bundle
          if-no-files-found: error

  windows:
    name: Build Windows native bundle
    needs: quality
    # Flutter 3.35.x supports the Visual Studio 2022 CMake generator. Pin the
    # image because windows-latest now uses Visual Studio 2026.
    runs-on: windows-2022
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Verify Windows build toolchain
        shell: pwsh
        run: |
          flutter config --enable-windows-desktop
          flutter doctor -v
          $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
          $visualStudio = & $vswhere -latest -products * -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath
          $visualStudioVersion = & $vswhere -latest -products * -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationVersion
          if (-not $visualStudio -or $visualStudioVersion -notlike '17.*') {
            throw "Flutter $env:FLUTTER_VERSION richiede Visual Studio 2022 (17.x); rilevato: $visualStudioVersion"
          }
          Write-Host "Toolchain Visual Studio ${visualStudioVersion}: $visualStudio"

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: ${{ env.RUST_VERSION }}

      - name: Install Protobuf compiler
        uses: arduino/setup-protoc@v3
        with:
          version: "25.3"
          repo-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Verify Protobuf compiler
        shell: pwsh
        run: |
          $protoc = (Get-Command protoc -ErrorAction Stop).Source
          "PROTOC=$protoc" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          & $protoc --version

      - name: Build native core
        shell: pwsh
        run: ./native/build-windows.ps1 -Profile release

      - name: Build Windows application
        run: flutter build windows --release

      - name: Verify native library is bundled
        shell: pwsh
        run: if (-not (Test-Path build/windows/x64/runner/Release/sylphy_core.dll)) { throw 'sylphy_core.dll non inclusa' }

      - name: Upload Windows bundle
        uses: actions/upload-artifact@v4
        with:
          name: sylphy-windows
          path: build/windows/x64/runner/Release
          if-no-files-found: error

  android:
    name: Build Android APK
    needs: quality
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: ${{ env.RUST_VERSION }}
          targets: armv7-linux-androideabi,aarch64-linux-android,x86_64-linux-android

      - name: Install cargo-ndk and Protobuf compiler
        run: |
          cargo install cargo-ndk --locked
          sudo apt-get update
          sudo apt-get install -y protobuf-compiler

      - name: Install Veilid Android NDK
        run: |
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "ndk;28.2.13676358"
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/28.2.13676358" >> "$GITHUB_ENV"
          echo "ANDROID_NDK_ROOT=$ANDROID_HOME/ndk/28.2.13676358" >> "$GITHUB_ENV"

      - name: Build native core
        shell: pwsh
        run: ./native/build-android.ps1 -Profile release

      - name: Verify native libraries are bundled
        run: |
          test -f android/app/src/main/jniLibs/armeabi-v7a/libsylphy_core.so
          test -f android/app/src/main/jniLibs/arm64-v8a/libsylphy_core.so
          test -f android/app/src/main/jniLibs/x86_64/libsylphy_core.so

      - name: Build Android application
        run: flutter build apk --release

      - name: Upload Android APK
        uses: actions/upload-artifact@v4
        with:
          name: sylphy-android
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error

  release:
    name: Publish GitHub Release
    if: github.event_name == 'push' && github.ref_type == 'tag' && startsWith(github.ref_name, 'v')
    needs:
      - linux
      - windows
      - android
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Verify release version
        shell: bash
        run: |
          app_version="$(sed -n 's/^version: \([^+]*\).*/\1/p' pubspec.yaml)"
          tag_version="${GITHUB_REF_NAME#v}"
          if [[ -z "$app_version" || "$tag_version" != "$app_version" ]]; then
            echo "Il tag $GITHUB_REF_NAME non corrisponde alla versione $app_version in pubspec.yaml." >&2
            exit 1
          fi

      - name: Download Linux bundle
        uses: actions/download-artifact@v4
        with:
          name: sylphy-linux
          path: release/linux

      - name: Download Windows bundle
        uses: actions/download-artifact@v4
        with:
          name: sylphy-windows
          path: release/windows

      - name: Download Android APK
        uses: actions/download-artifact@v4
        with:
          name: sylphy-android
          path: release/android

      - name: Package release files
        shell: bash
        run: |
          mkdir -p release-assets
          tar -C release/linux -czf "release-assets/sylphy-${GITHUB_REF_NAME}-linux-x64.tar.gz" .
          (cd release/windows && zip -r "../../release-assets/sylphy-${GITHUB_REF_NAME}-windows-x64.zip" .)
          cp release/android/app-release.apk "release-assets/sylphy-${GITHUB_REF_NAME}-android.apk"
          (cd release-assets && sha256sum sylphy-* > SHA256SUMS.txt)

      - name: Create or update GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" release-assets/* --clobber
          else
            gh release create "$GITHUB_REF_NAME" release-assets/* --verify-tag --generate-notes --title "Sylphy $GITHUB_REF_NAME"
          fi
